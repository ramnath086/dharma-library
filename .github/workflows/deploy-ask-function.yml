name: Deploy Supabase Function (ask)

# Manual trigger for function-only deployment.
# Deploys ONLY supabase/functions/ask without running database migrations,
# seed.sql, ingest.py, generated SQL imports, or embedding generation.
#
# Requires repository secrets:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
on:
  workflow_dispatch:

jobs:
  deploy-ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Link Supabase project
        # `link` only records the project ref for later commands; it applies no
        # migrations. The DB password is passed purely so the CLI never drops
        # into an interactive prompt on a non-TTY runner.
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy ask edge function
        run: supabase functions deploy ask
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
