# TEMPORARY diagnostic: surfaces `deno check` output as annotations so it is
# readable from the GitHub API (job logs are not downloadable in this sandbox).
# Removed again in the follow-up commit.
name: deno check diagnostic

on:
  push:
    branches: [arena/**]
  workflow_dispatch:

jobs:
  deno-diag:
    name: deno check (diagnostic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check and emit every line as an annotation
        shell: bash
        run: |
          set +e
          deno check supabase/functions/ask/index.ts > out.txt 2>&1
          code=$?
          echo "deno check exit code: $code"
          deno --version
          cat out.txt
          n=0
          while IFS= read -r line; do
            if [ -n "$line" ] && [ "$n" -lt 60 ]; then
              echo "::warning title=deno-check::$(echo "$line" | tr -d '\r')"
            fi
            n=$((n + 1))
          done < out.txt
          exit 0
