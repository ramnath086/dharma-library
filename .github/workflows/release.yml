name: Release Android + Publish Website

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: release-and-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\)+[0-9][0-9]*/\1/p' app/pubspec.yaml | head -n1)
          build=$(sed -n 's/^version:[[:space:]]*[^+[:space:]]*+\([0-9][0-9]*\).*/\1/p' app/pubspec.yaml | head -n1)
          test -n "$version"
          test -n "$build"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Download signed APK from CI
        uses: actions/download-artifact@v4
        with:
          name: dharma-library-apk
          path: release-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare website
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp website/index.html website/download.html website/styles.css _site/
          printf '{\n  "version": "%s",\n  "build": "%s",\n  "download": "https://github.com/ramnath086/dharma-library/releases/latest/download/dharma-library-latest.apk",\n  "release": "v%s"\n}\n' "$VERSION" "$BUILD" "$VERSION" > _site/version.json
          touch _site/.nojekyll
          find _site -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --target ${{ github.event.workflow_run.head_sha }} \
            --title "Dharma Library v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Publish APK assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=$(find release-artifact -type f -name '*.apk' | head -n1)
          test -n "$apk"
          gh release upload "$TAG" \
            "$apk#dharma-library-v${VERSION}.apk" \
            "$apk#dharma-library-latest.apk" \
            --clobber

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publication summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          {
            echo "### Dharma Library publication"
            echo "- Version: $VERSION"
            echo "- Build: $BUILD"
            echo "- CI commit: ${{ github.event.workflow_run.head_sha }}"
            echo "- GitHub Release: v$VERSION"
            echo "- GitHub Pages APK: /downloads/dharma-library-latest.apk"
          } >> "$GITHUB_STEP_SUMMARY"
