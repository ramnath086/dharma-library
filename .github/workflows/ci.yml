name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  database:
    name: Database (migrations · seed · RLS tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.6.1.139
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGURI: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Auth stub + migrations
        run: |
          psql "$PGURI" -v ON_ERROR_STOP=1 -c "create schema if not exists auth" || true
          psql "$PGURI" -v ON_ERROR_STOP=1 -f supabase/tests/00_local_auth_stub.sql || true
          for f in supabase/migrations/*.sql; do echo "== $f"; psql "$PGURI" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Seed + ingest content
        run: |
          psql "$PGURI" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          python3 scripts/ingest.py
          for f in $(ls -1 content/generated/*.sql | sort); do echo "== $f"; psql "$PGURI" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: RLS / API tests
        run: psql "$PGURI" -v ON_ERROR_STOP=1 -q -f supabase/tests/10_rls_and_api.sql
      - name: Bundle export covers every published work
        run: |
          python3 scripts/export_bundle.py --db "$PGURI"
          python3 - <<'PY'
          import json
          def load(slug):
              return json.load(open(f'app/assets/bundles/{slug}.json'))
          work = json.load(open('content/bhagavata-purana/work.json'))
          meta = work['metadata']
          bhagavata = load('bhagavata-purana')
          n_verses = sum(len(s['verses']) for s in bhagavata['sections'])
          n_sections = len(bhagavata['sections'])
          assert n_verses == meta['imported_verse_count'], (n_verses, meta)
          assert n_sections == meta['imported_chapter_count'], (n_sections, meta)
          if meta.get('complete'):
              assert n_sections == 335, n_sections
          else:
              assert n_sections == 1 and n_verses == 10, 'pilot Bhāgavata bundle must contain 1.1.1-1.1.10'
          assert all(e['rights_status'] in ('public_domain','open_license','permission_granted','original') for e in bhagavata['editions'])
          gita = load('bhagavad-gita')
          assert len(gita['sections']) == 18, 'Gita bundle must contain 18 chapters'
          assert sum(len(s['verses']) for s in gita['sections']) == 700, 'Gita bundle must contain 700 verses'
          assert all(e['rights_status'] in ('public_domain','open_license','permission_granted','original') for e in gita['editions'])
          print(f"all published bundles ok: Bhāgavata {n_sections} chapters / {n_verses} verses; Gītā 18 chapters / 700 verses")
          PY
      - name: Python unit tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -v 2>&1 | tee python-tests.txt || status=$?
          if [ "${status:-0}" -ne 0 ]; then
            tail -n 80 python-tests.txt | while IFS= read -r line; do echo "::error title=Python tests::${line}"; done
          fi
          exit ${status:-0}

  flutter:
    name: Flutter (analyze · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Configure Android release signing (if secrets present)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice title=signing::ANDROID_KEYSTORE_BASE64 not set — building unsigned APK/AAB with debug keystore (expected for CI without release secrets)"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r' | base64 --decode > android/app/upload-keystore.jks 2> /tmp/b64.err || {
            echo "::warning title=signing::Failed to decode ANDROID_KEYSTORE_BASE64: $(cat /tmp/b64.err)"
            echo "::notice title=signing::Falling back to unsigned build"
            rm -f android/app/upload-keystore.jks
            exit 0
          }
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::warning title=signing::Decoded keystore empty — falling back to unsigned"
            rm -f android/app/upload-keystore.jks
            exit 0
          fi
          ls -lh android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS:-upload}
          storeFile=upload-keystore.jks
          EOF
          cat android/key.properties | sed 's/Password=.*/Password=***/'
          echo "::notice title=signing::Release keystore configured — signed AAB/APK will be built"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Regenerate platform boilerplate (non-destructive; Gradle files are not committed)
        shell: bash
        run: |
          flutter --version
          flutter create . --platforms=android --org org.dharmalibrary --project-name dharma_library > create.txt 2>&1 || status=$?
          cat create.txt
          grep -vE '^\s*$' create.txt | grep -v '(created)' | head -n 40 | while IFS= read -r l; do echo "::warning title=create::${l}"; done
          exit ${status:-0}
      - name: Re-apply Android release signing after regenerate (flutter create may delete key.properties)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret — unsigned build"
            exit 0
          fi
          if [ ! -f android/app/upload-keystore.jks ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r' | base64 --decode > android/app/upload-keystore.jks 2> /tmp/b64.err || {
              echo "::warning title=signing::Re-decode failed: $(cat /tmp/b64.err)"
              exit 0
            }
          fi
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS:-upload}
          storeFile=upload-keystore.jks
          EOF
          cat android/key.properties | sed 's/Password=.*/Password=***/'
          echo "Re-applied key.properties after flutter create"
          ls -lh android/app/upload-keystore.jks android/key.properties
      - name: Generate bounded offline runtime assets
        run: python3 ../scripts/prepare_offline_assets.py
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: python3 ../scripts/dart_lint_lite.py
      - name: flutter analyze
        shell: bash
        run: |
          flutter analyze --no-pub > analyze.txt 2>&1 || true
          cat analyze.txt
          { echo '### flutter analyze'; echo '```'; cat analyze.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -vE '^\s*$' analyze.txt | head -60 | while IFS= read -r l; do echo "::warning title=analyze::${l}"; done
          if grep -qE 'error •' analyze.txt; then echo "::error title=analyze::analyzer errors"; exit 1; fi
          if ! grep -qE 'No issues found|issues? found.' analyze.txt; then echo "::error title=analyze::analyzer did not complete: $(head -c 800 analyze.txt | tr '\n' ' ')"; exit 1; fi
      - name: flutter test
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test.txt || status=$?
          { echo '### flutter test'; echo '```'; tail -n 200 test.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -vE '^\s*$' test.txt | grep -vE '^\s*(✅|\+[0-9]+)' | tr -d '\r' | tail -n 80 | while IFS= read -r l; do echo "::warning title=test::${l}"; done
          exit ${status:-0}
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: flutter-logs, path: app/*.txt, if-no-files-found: ignore }
      - name: Build release APK (signed if keystore present, otherwise unsigned)
        shell: bash
        run: |
          set -e
          echo "=== Pre-build Gradle files check ==="
          ls -lh android/app/build.gradle* || true
          if [ -f android/app/build.gradle.kts ]; then
            echo "--- android/app/build.gradle.kts (before injection) ---"
            cat android/app/build.gradle.kts
            echo "--- end ---"
          fi
          if [ -f android/app/build.gradle ]; then
            echo "--- android/app/build.gradle (before injection) ---"
            cat android/app/build.gradle
            echo "--- end ---"
          fi

          if [ -f android/key.properties ]; then
            echo "Ensuring release signingConfig exists in Gradle files"
            python3 <<'PY'
          import pathlib, re

          kts_path = pathlib.Path("android/app/build.gradle.kts")
          gradle_path = pathlib.Path("android/app/build.gradle")

          LOADER_KTS = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }'''

          CREATE_KTS = '''create("release") {
              if (keystorePropertiesFile.exists()) {
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }'''

          CREATE_KTS_RE = r'create\(\s*"release"\s*\)'

          USE_RELEASE_KTS = ('signingConfig = if (keystorePropertiesFile.exists()) '
                             'signingConfigs.getByName("release") else signingConfigs.getByName("debug")')

          MINIFY_KTS = '''isMinifyEnabled = true
          isShrinkResources = true
          proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'''

          LOADER_GROOVY = '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }'''

          CREATE_GROOVY = '''release {
              if (keystorePropertiesFile.exists()) {
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
                  storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                  storePassword keystoreProperties['storePassword']
              }
          }'''

          CREATE_GROOVY_RE = r'signingConfigs\s*\{[^{}]*\brelease\s*\{'

          USE_RELEASE_GROOVY = ('signingConfig = keystorePropertiesFile.exists() '
                                '? signingConfigs.getByName("release") : signingConfigs.getByName("debug")')

          MINIFY_GROOVY = (
              "minifyEnabled true\n"
              "shrinkResources true\n"
              "proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'"
          )

          RELEASE_TYPES = ("signingConfig", "minifyEnabled", "isMinifyEnabled", "shrinkResources",
                           "isShrinkResources", "proguardFiles", "debuggable", "applicationIdSuffix")


          def indented(block, pad):
              return "\n".join(pad + line if line.strip() else line for line in block.split("\n"))


          def brace_end(text, open_idx):
              """Index of the '}' matching the '{' at open_idx, or -1 when the block is unbalanced."""
              depth = 0
              for i in range(open_idx, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              return -1


          def wire_signing(txt, create_re, create_block, use_release, minify_block, label):
              """Ensure a release signing config exists and that buildTypes.release references it.

              The Flutter template only contains `signingConfig = signingConfigs.getByName("debug")`:
              there is no `signingConfigs { }` block at all, so the block must be created before the
              release build type can point at signingConfigs.release.
              """
              changes = []

              if not re.search(create_re, txt):
                  real_block = re.search(r'signingConfigs\s*\{', txt)
                  if real_block:
                      txt = txt[:real_block.end()] + "\n" + indented(create_block, "    ") + "\n" + txt[real_block.end():]
                      changes.append("added the release signing config to the existing signingConfigs block")
                  else:
                      app_block = re.search(r'(?m)^\s*android\s*\{', txt)
                      if not app_block:
                          raise SystemExit("%s: no android { } block found" % label)
                      block = "signingConfigs {\n" + indented(create_block, "    ") + "\n}"
                      txt = txt[:app_block.end()] + "\n" + indented(block, "    ") + "\n" + txt[app_block.end():]
                      changes.append("created a signingConfigs block (with the release config) inside the android block")

              bt = re.search(r'buildTypes\s*\{', txt)
              if not bt:
                  raise SystemExit("%s: no buildTypes block found" % label)
              bt_end = brace_end(txt, bt.end() - 1)
              if bt_end < 0:
                  raise SystemExit("%s: unbalanced buildTypes block" % label)

              body = [use_release]
              if minify_block:
                  body += minify_block.split("\n")
              rel = re.search(r'\brelease\s*\{', txt[bt.end():bt_end])
              if rel:
                  rel_open = bt.end() + rel.end() - 1
                  rel_end = brace_end(txt, rel_open)
                  if rel_end < 0:
                      raise SystemExit("%s: unbalanced release block" % label)
                  # keep any settings the template already had; comments and the old signingConfig go away
                  kept = [ln.strip() for ln in txt[rel_open + 1:rel_end].split("\n")
                          if ln.strip() and not ln.strip().startswith(("//", "*", "/*"))
                          and not ln.strip().startswith(RELEASE_TYPES)]
                  txt = txt[:rel_open + 1] + "\n            " + "\n            ".join(body + kept) + "\n        " + txt[rel_end:]
                  changes.append("wired buildTypes.release to signingConfigs.release (debug keystore fallback kept)")
              else:
                  new_block = "release {\n            " + "\n            ".join(body) + "\n        }\n        "
                  txt = txt[:bt_end] + new_block + txt[bt_end:]
                  changes.append("added a release build type wired to signingConfigs.release")
              return txt, changes


          def fix_kts():
              if not kts_path.exists():
                  return
              txt = kts_path.read_text()
              added = []
              if "import java.util.Properties" not in txt:
                  txt = "import java.util.Properties\n" + txt
                  added.append("import java.util.Properties")
              if "import java.io.FileInputStream" not in txt:
                  txt = "import java.io.FileInputStream\n" + txt
                  added.append("import java.io.FileInputStream")
              if "keystorePropertiesFile" not in txt:
                  m = re.search(r'plugins\s*\{[^}]*\}', txt, re.DOTALL)
                  if m:
                      txt = txt[:m.end()] + "\n\n" + LOADER_KTS + "\n" + txt[m.end():]
                  else:
                      txt = LOADER_KTS + "\n\n" + txt
                  added.append("keystoreProperties loader for android/key.properties")
              minify = MINIFY_KTS if (kts_path.parent / "proguard-rules.pro").exists() else None
              txt, changes = wire_signing(txt, CREATE_KTS_RE, CREATE_KTS, USE_RELEASE_KTS, minify, "build.gradle.kts")
              kts_path.write_text(txt)
              print("build.gradle.kts: " + ("; ".join(added + changes) if added + changes else "no signing changes needed"))


          def fix_gradle():
              if not gradle_path.exists():
                  return
              txt = gradle_path.read_text()
              added = []
              if "keystorePropertiesFile" not in txt:
                  txt = LOADER_GROOVY + "\n\n" + txt
                  added.append("keystoreProperties loader for android/key.properties")
              minify = MINIFY_GROOVY if (gradle_path.parent / "proguard-rules.pro").exists() else None
              txt, changes = wire_signing(txt, CREATE_GROOVY_RE, CREATE_GROOVY, USE_RELEASE_GROOVY, minify, "build.gradle")
              gradle_path.write_text(txt)
              print("build.gradle: " + ("; ".join(added + changes) if added + changes else "no signing changes needed"))


          def verify():
              """Fail the step loudly instead of letting Gradle fail with 'SigningConfig ... not found'."""
              problems = []
              if kts_path.exists():
                  txt = kts_path.read_text()
                  if not re.search(CREATE_KTS_RE, txt):
                      problems.append('build.gradle.kts: signingConfigs.create("release") is missing')
                  if "keystorePropertiesFile" not in txt:
                      problems.append("build.gradle.kts: keystoreProperties loader is missing")
                  if 'getByName("release")' not in txt:
                      problems.append("build.gradle.kts: buildTypes.release is not wired to signingConfigs.release")
              if gradle_path.exists():
                  txt = gradle_path.read_text()
                  if not re.search(CREATE_GROOVY_RE, txt):
                      problems.append("build.gradle: release signing config is missing")
                  if "keystorePropertiesFile" not in txt:
                      problems.append("build.gradle: keystoreProperties loader is missing")
              if problems:
                  raise SystemExit("release signing setup incomplete: " + "; ".join(problems))
              print("signing setup verified: release keystore wired into buildTypes.release, "
                    "debug keystore kept as the fallback when android/key.properties is absent")


          fix_kts()
          fix_gradle()
          verify()
          PY
          fi

          echo "=== After injection ==="
          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
            echo "---"
            grep -n "signingConfig\|signingConfigs\|keystoreProperties" android/app/build.gradle.kts | head -n 40
          fi
          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          fi

          if [ -f android/key.properties ]; then
            echo "Building SIGNED APK with release keystore"
            cat android/key.properties | sed 's/Password=.*/Password=***/'
            ls -lh android/app/upload-keystore.jks
          else
            echo "Building UNSIGNED APK with debug keystore"
          fi
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} > build.txt 2>&1 || status=$?
          cat build.txt
          grep -vE '^\s*$' build.txt | grep -iE 'error|exception|failed|what went wrong|not found|could not' | head -60 | tr -d '\r' | while IFS= read -r l; do echo "::warning title=build::${l}"; done
          exit ${status:-0}
      - name: Verify APK contains every bundled work
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          required = [
              'assets/flutter_assets/assets/bundles/bhagavata-purana.json',
              'assets/flutter_assets/assets/bundles/bhagavad-gita.json',
              'assets/flutter_assets/assets/audio/launch_chime.wav',
              'assets/flutter_assets/assets/audio/sloka_chime.wav',
          ]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              missing = [name for name in required if name not in names]
              assert not missing, f'APK is missing bundled assets: {missing}'
              gita = json.loads(z.read(required[1]))
              bhagavata = json.loads(z.read(required[0]))
          work = json.load(open('../content/bhagavata-purana/work.json'))
          meta = work['metadata']
          n_verses = sum(len(s['verses']) for s in bhagavata['sections'])
          n_sections = len(bhagavata['sections'])
          assert len(gita['sections']) == 18
          assert sum(len(s['verses']) for s in gita['sections']) == 700
          assert n_verses == meta['imported_verse_count'], (n_verses, meta)
          assert n_sections == meta['imported_chapter_count'], (n_sections, meta)
          print(f'APK assets verified: Bhāgavata {n_sections} chapters / {n_verses} verses; Gītā 18 chapters / 700 verses')
          PY
      - name: Verify APK runtime chapters match canonical bundles exactly
        run: python3 ../scripts/prepare_offline_assets.py --verify-archive build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: dharma-library-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Build release AAB (signed if keystore present, otherwise unsigned)
        shell: bash
        run: |
          if [ -f android/key.properties ]; then
            echo "Building SIGNED AAB with release keystore"
          else
            echo "Building UNSIGNED AAB with debug keystore (Play uploads use the owner's keystore)"
          fi
          flutter build appbundle --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} > aab.txt 2>&1 || status=$?
          cat aab.txt
          grep -vE '^\s*$' aab.txt | grep -iE 'error|exception|failed|what went wrong|not found|could not' | head -60 | tr -d '\r' | while IFS= read -r l; do echo "::warning title=aab::${l}"; done
          exit ${status:-0}
      - uses: actions/upload-artifact@v7
        with:
          name: dharma-library-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
      - name: Verify signed AAB contains required assets
        shell: bash
        run: |
          python3 - <<'PY'
          import os, zipfile
          aab_path = 'build/app/outputs/bundle/release/app-release.aab'
          size = os.path.getsize(aab_path)
          assert size > 1024*1024, f"AAB too small: {size}"
          print(f"AAB size {size} bytes — contains bundled assets verified via APK step")
          with zipfile.ZipFile(aab_path) as z:
              print(f"AAB contains {len(z.namelist())} entries")
          PY
      - name: Verify AAB runtime chapters match canonical bundles exactly
        run: python3 ../scripts/prepare_offline_assets.py --verify-archive build/app/outputs/bundle/release/app-release.aab
      - name: Verify APK/AAB are signed with the release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ ! -f android/key.properties ]; then
            echo "::notice title=signing-verify::no release keystore configured — unsigned fallback, skipping signature check"
            exit 0
          fi
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          for f in "$apk" "$aab"; do
            [ -s "$f" ] || { echo "::error title=signing-verify::missing or empty artifact $f"; exit 1; }
          done

          # SHA-256 of the certificate in the upload keystore (the source of truth)
          keystore_sha=$(keytool -list -v -keystore android/app/upload-keystore.jks \
              -alias "${ANDROID_KEY_ALIAS:-upload}" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
              | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr -d '[:space:]' | tr 'A-Z' 'a-z')
          if [ -z "$keystore_sha" ]; then
            echo "::warning title=signing-verify::could not read the upload keystore certificate — skipping signature verification"
            exit 0
          fi
          echo "::notice title=signing-verify::release keystore certificate SHA-256 $keystore_sha"

          # APK: prefer apksigner (covers the v2/v3 schemes), fall back to the v1 JAR signature
          apk_sha=""
          apksigner_bin=$(command -v apksigner 2>/dev/null || true)
          if [ -z "$apksigner_bin" ]; then
            for sdk in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
              [ -n "$sdk" ] && [ -d "$sdk/build-tools" ] || continue
              apksigner_bin=$(ls -1d "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
              [ -n "$apksigner_bin" ] && break
            done
          fi
          if [ -n "$apksigner_bin" ]; then
            apk_sha=$("$apksigner_bin" verify --print-certs "$apk" 2>/dev/null \
                | grep -m1 'SHA-256 digest' | sed 's/.*digest: *//' | tr -d ':' | tr -d '[:space:]' | tr 'A-Z' 'a-z')
          fi
          if [ -z "$apk_sha" ]; then
            apk_sha=$(keytool -printcert -jarfile "$apk" 2>/dev/null \
                | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr -d '[:space:]' | tr 'A-Z' 'a-z')
          fi

          # AAB: always carries a v1 JAR signature
          aab_sha=$(keytool -printcert -jarfile "$aab" 2>/dev/null \
              | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr -d '[:space:]' | tr 'A-Z' 'a-z')

          status=0
          for pair in "APK:$apk_sha" "AAB:$aab_sha"; do
            label=${pair%%:*}; sha=${pair#*:}
            if [ -z "$sha" ]; then
              echo "::warning title=signing-verify::$label signature could not be read (no supported signature found) — not treated as a failure"
            elif [ "$sha" = "$keystore_sha" ]; then
              echo "::notice title=signing-verify::$label is signed with the release keystore (certificate SHA-256 $sha)"
            else
              echo "::error title=signing-verify::$label signer SHA-256 $sha does not match the release keystore ($keystore_sha)"
              status=1
            fi
          done
          exit $status


  edge-functions:
    name: Edge functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - run: deno check supabase/functions/ask/index.ts
      - run: deno test -A supabase/functions/ask/
