name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  database:
    name: Database (migrations · seed · RLS tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.6.1.139
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGURI: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Auth stub + migrations
        run: |
          psql "$PGURI" -v ON_ERROR_STOP=1 -c "create schema if not exists auth" || true
          psql "$PGURI" -v ON_ERROR_STOP=1 -f supabase/tests/00_local_auth_stub.sql || true
          for f in supabase/migrations/*.sql; do echo "== $f"; psql "$PGURI" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Seed + ingest content
        run: |
          psql "$PGURI" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          python3 scripts/ingest.py
          for f in $(ls -1 content/generated/*.sql | sort); do echo "== $f"; psql "$PGURI" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: RLS / API tests
        run: psql "$PGURI" -v ON_ERROR_STOP=1 -q -f supabase/tests/10_rls_and_api.sql
      - name: Bundle export covers every published work
        run: |
          python3 scripts/export_bundle.py --db "$PGURI"
          python3 - <<'PY'
          import json
          def load(slug):
              return json.load(open(f'app/assets/bundles/{slug}.json'))
          work = json.load(open('content/bhagavata-purana/work.json'))
          meta = work['metadata']
          bhagavata = load('bhagavata-purana')
          n_verses = sum(len(s['verses']) for s in bhagavata['sections'])
          n_sections = len(bhagavata['sections'])
          assert n_verses == meta['imported_verse_count'], (n_verses, meta)
          assert n_sections == meta['imported_chapter_count'], (n_sections, meta)
          if meta.get('complete'):
              assert n_sections == 335, n_sections
          else:
              assert n_sections == 1 and n_verses == 10, 'pilot Bhāgavata bundle must contain 1.1.1-1.1.10'
          assert all(e['rights_status'] in ('public_domain','open_license','permission_granted','original') for e in bhagavata['editions'])
          gita = load('bhagavad-gita')
          assert len(gita['sections']) == 18, 'Gita bundle must contain 18 chapters'
          assert sum(len(s['verses']) for s in gita['sections']) == 700, 'Gita bundle must contain 700 verses'
          assert all(e['rights_status'] in ('public_domain','open_license','permission_granted','original') for e in gita['editions'])
          print(f"all published bundles ok: Bhāgavata {n_sections} chapters / {n_verses} verses; Gītā 18 chapters / 700 verses")
          PY
      - name: Python unit tests
        run: python3 -m unittest discover -s scripts/tests -v

  flutter:
    name: Flutter (analyze · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Configure Android release signing (if secrets present)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice title=signing::ANDROID_KEYSTORE_BASE64 not set — building unsigned APK/AAB with debug keystore (expected for CI without release secrets)"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r' | base64 --decode > android/app/upload-keystore.jks 2> /tmp/b64.err || {
            echo "::warning title=signing::Failed to decode ANDROID_KEYSTORE_BASE64: $(cat /tmp/b64.err)"
            echo "::notice title=signing::Falling back to unsigned build"
            rm -f android/app/upload-keystore.jks
            exit 0
          }
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::warning title=signing::Decoded keystore empty — falling back to unsigned"
            rm -f android/app/upload-keystore.jks
            exit 0
          fi
          ls -lh android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS:-upload}
          storeFile=upload-keystore.jks
          EOF
          cat android/key.properties | sed 's/Password=.*/Password=***/'
          echo "::notice title=signing::Release keystore configured — signed AAB/APK will be built"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Regenerate platform boilerplate (non-destructive; Gradle files are not committed)
        shell: bash
        run: |
          flutter --version
          flutter create . --platforms=android --org org.dharmalibrary --project-name dharma_library > create.txt 2>&1 || status=$?
          cat create.txt
          grep -vE '^\s*$' create.txt | grep -v '(created)' | head -n 40 | while IFS= read -r l; do echo "::warning title=create::${l}"; done
          exit ${status:-0}
      - name: Re-apply Android release signing after regenerate (flutter create may delete key.properties)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret — unsigned build"
            exit 0
          fi
          if [ ! -f android/app/upload-keystore.jks ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r' | base64 --decode > android/app/upload-keystore.jks 2> /tmp/b64.err || {
              echo "::warning title=signing::Re-decode failed: $(cat /tmp/b64.err)"
              exit 0
            }
          fi
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS:-upload}
          storeFile=upload-keystore.jks
          EOF
          cat android/key.properties | sed 's/Password=.*/Password=***/'
          echo "Re-applied key.properties after flutter create"
          ls -lh android/app/upload-keystore.jks android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: python3 ../scripts/dart_lint_lite.py
      - name: flutter analyze
        shell: bash
        run: |
          flutter analyze --no-pub > analyze.txt 2>&1 || true
          cat analyze.txt
          { echo '### flutter analyze'; echo '```'; cat analyze.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -vE '^\s*$' analyze.txt | head -60 | while IFS= read -r l; do echo "::warning title=analyze::${l}"; done
          if grep -qE 'error •' analyze.txt; then echo "::error title=analyze::analyzer errors"; exit 1; fi
          if ! grep -qE 'No issues found|issues? found.' analyze.txt; then echo "::error title=analyze::analyzer did not complete: $(head -c 800 analyze.txt | tr '\n' ' ')"; exit 1; fi
      - name: flutter test
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test.txt || status=$?
          { echo '### flutter test'; echo '```'; tail -n 200 test.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -vE '^\s*$' test.txt | grep -vE '^\s*(✅|\+[0-9]+)' | tr -d '\r' | tail -n 80 | while IFS= read -r l; do echo "::warning title=test::${l}"; done
          exit ${status:-0}
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: flutter-logs, path: app/*.txt, if-no-files-found: ignore }
      - name: Build release APK (signed if keystore present, otherwise unsigned)
        shell: bash
        run: |
          set -e
          echo "=== Pre-build Gradle files check ==="
          ls -lh android/app/build.gradle* || true
          if [ -f android/app/build.gradle.kts ]; then
            echo "--- android/app/build.gradle.kts (before injection) ---"
            cat android/app/build.gradle.kts
            echo "--- end ---"
          fi
          if [ -f android/app/build.gradle ]; then
            echo "--- android/app/build.gradle (before injection) ---"
            cat android/app/build.gradle
            echo "--- end ---"
          fi

          if [ -f android/key.properties ]; then
            echo "Ensuring release signingConfig exists in Gradle files"
            python3 <<'PY'
          import pathlib, re, sys
          kts_path = pathlib.Path("android/app/build.gradle.kts")
          gradle_path = pathlib.Path("android/app/build.gradle")

          def fix_kts():
              if not kts_path.exists():
                  return
              txt = kts_path.read_text()
              orig = txt

              # Ensure imports
              if "java.util.Properties" not in txt:
                  txt = "import java.util.Properties\n" + txt
              if "java.io.FileInputStream" not in txt:
                  txt = "import java.io.FileInputStream\n" + txt

              # Ensure keystoreProperties loading after plugins block
              if "keystoreProperties" not in txt or "keystorePropertiesFile" not in txt:
                  # Insert after plugins { ... }
                  # Find plugins block end
                  m = re.search(r'plugins\s*\{[^}]*\}', txt, re.DOTALL)
                  if m:
                      insert = '''
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''
                      txt = txt[:m.end()] + "\n" + insert + "\n" + txt[m.end():]
                  else:
                      # fallback prepend after imports
                      txt = txt + "\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file(\"key.properties\")\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(FileInputStream(keystorePropertiesFile)) }\n"

              # Ensure signingConfigs has release
              if 'create("release")' not in txt:
                  # If signingConfigs exists, inject release inside it
                  if "signingConfigs" in txt:
                      txt = txt.replace("signingConfigs {", "signingConfigs {\n        create(\"release\") {\n            if (keystorePropertiesFile.exists()) {\n                keyAlias = keystoreProperties[\"keyAlias\"] as String\n                keyPassword = keystoreProperties[\"keyPassword\"] as String\n                storeFile = keystoreProperties[\"storeFile\"]?.let { file(it) }\n                storePassword = keystoreProperties[\"storePassword\"] as String\n            }\n        }\n")
                  else:
                      # No signingConfigs at all, add before buildTypes
                      txt = txt.replace("android {", "android {\n    signingConfigs {\n        create(\"release\") {\n            if (keystorePropertiesFile.exists()) {\n                keyAlias = keystoreProperties[\"keyAlias\"] as String\n                keyPassword = keystoreProperties[\"keyPassword\"] as String\n                storeFile = keystoreProperties[\"storeFile\"]?.let { file(it) }\n                storePassword = keystoreProperties[\"storePassword\"] as String\n            }\n        }\n    }\n")

              # Ensure buildTypes release uses release config when key.properties exists, else debug
              # Replace the whole buildTypes block for safety
              # Find buildTypes { ... } and replace its release section
              # Simple approach: replace any signingConfig = signingConfigs.getByName("debug") inside release with conditional logic that we will then simplify via sed
              # Instead, rewrite buildTypes release to always use release if file exists
              # Use regex to replace buildTypes block content
              def replace_buildtypes(m):
                  block = m.group(0)
                  # Replace debug with release if keystorePropertiesFile exists else debug, but we can just set to release and handle fallback
                  # We'll set to release and ensure release signingConfig exists even without keystore (empty) to avoid not found error
                  new_release = '''
              release {
                      // Use release signing if key.properties exists, otherwise debug for CI without secrets
                      signingConfig = if (keystorePropertiesFile.exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }'''
                  # Replace inner release { ... } with new_release
                  block = re.sub(r'release\s*\{[^}]*\}', new_release, block, flags=re.DOTALL)
                  return block

              txt = re.sub(r'buildTypes\s*\{[^}]*release\s*\{[^}]*\}[^}]*\}', replace_buildtypes, txt, flags=re.DOTALL)

              # If still contains debug reference for release, force replace
              txt = txt.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = if (keystorePropertiesFile.exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")')
              # Ensure proguard present
              if "proguardFiles" not in txt:
                  txt = txt.replace('isMinifyEnabled = true', 'isMinifyEnabled = true\n            isShrinkResources = true\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")')

              if txt != orig:
                  print("Injected release signingConfig into build.gradle.kts")
                  kts_path.write_text(txt)
              else:
                  print("No injection needed for kts")

          def fix_gradle():
              if not gradle_path.exists():
                  return
              txt = gradle_path.read_text()
              orig = txt
              if "keystoreProperties" not in txt:
                  # Insert after android {
                  txt = txt.replace("android {", "android {\n    def keystoreProperties = new Properties()\n    def keystorePropertiesFile = rootProject.file('key.properties')\n    if (keystorePropertiesFile.exists()) {\n        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n    }\n")
              if "signingConfigs" not in txt:
                  txt = txt.replace("android {", "android {\n    signingConfigs {\n        release {\n            if (keystorePropertiesFile.exists()) {\n                keyAlias keystoreProperties['keyAlias']\n                keyPassword keystoreProperties['keyPassword']\n                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n                storePassword keystoreProperties['storePassword']\n            }\n        }\n    }\n")
              elif "release" not in txt.split("signingConfigs")[1].split("buildTypes")[0] if "buildTypes" in txt else True:
                  txt = txt.replace("signingConfigs {", "signingConfigs {\n        release {\n            if (keystorePropertiesFile.exists()) {\n                keyAlias keystoreProperties['keyAlias']\n                keyPassword keystoreProperties['keyPassword']\n                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n                storePassword keystoreProperties['storePassword']\n            }\n        }\n")
              # Fix buildTypes release
              txt = re.sub(r'signingConfig\s+signingConfigs\.debug', 'signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug', txt)
              txt = re.sub(r'signingConfig\s+signingConfigs\.release', 'signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug', txt)
              if "proguardFiles" not in txt:
                  txt = txt.replace("signingConfigs.debug", "signingConfigs.debug\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'")
                  txt = txt.replace("signingConfigs.release", "signingConfigs.release\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'")
              if txt != orig:
                  print("Injected release signingConfig into build.gradle")
                  gradle_path.write_text(txt)

          fix_kts()
          fix_gradle()
          PY
          fi

          echo "=== After injection ==="
          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
            echo "---"
            grep -n "signingConfig\|signingConfigs\|keystoreProperties" android/app/build.gradle.kts | head -n 40
          fi
          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          fi

          if [ -f android/key.properties ]; then
            echo "Building SIGNED APK with release keystore"
            cat android/key.properties | sed 's/Password=.*/Password=***/'
            ls -lh android/app/upload-keystore.jks
          else
            echo "Building UNSIGNED APK with debug keystore"
          fi
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} > build.txt 2>&1 || status=$?
          cat build.txt
          grep -vE '^\s*$' build.txt | grep -iE 'error|exception|failed|what went wrong|not found|could not' | head -60 | tr -d '\r' | while IFS= read -r l; do echo "::warning title=build::${l}"; done
          exit ${status:-0}
      - name: Verify APK contains every bundled work
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          required = [
              'assets/flutter_assets/assets/bundles/bhagavata-purana.json',
              'assets/flutter_assets/assets/bundles/bhagavad-gita.json',
              'assets/flutter_assets/assets/audio/launch_chime.wav',
              'assets/flutter_assets/assets/audio/sloka_chime.wav',
          ]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              missing = [name for name in required if name not in names]
              assert not missing, f'APK is missing bundled assets: {missing}'
              gita = json.loads(z.read(required[1]))
              bhagavata = json.loads(z.read(required[0]))
          work = json.load(open('../content/bhagavata-purana/work.json'))
          meta = work['metadata']
          n_verses = sum(len(s['verses']) for s in bhagavata['sections'])
          n_sections = len(bhagavata['sections'])
          assert len(gita['sections']) == 18
          assert sum(len(s['verses']) for s in gita['sections']) == 700
          assert n_verses == meta['imported_verse_count'], (n_verses, meta)
          assert n_sections == meta['imported_chapter_count'], (n_sections, meta)
          print(f'APK assets verified: Bhāgavata {n_sections} chapters / {n_verses} verses; Gītā 18 chapters / 700 verses')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dharma-library-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Build release AAB (signed if keystore present, otherwise unsigned)
        shell: bash
        run: |
          if [ -f android/key.properties ]; then
            echo "Building SIGNED AAB with release keystore"
          else
            echo "Building UNSIGNED AAB with debug keystore (Play uploads use the owner's keystore)"
          fi
          flutter build appbundle --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} > aab.txt 2>&1 || status=$?
          cat aab.txt
          grep -vE '^\s*$' aab.txt | grep -iE 'error|exception|failed|what went wrong|not found|could not' | head -60 | tr -d '\r' | while IFS= read -r l; do echo "::warning title=aab::${l}"; done
          exit ${status:-0}
      - uses: actions/upload-artifact@v7
        with:
          name: dharma-library-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
      - name: Verify signed AAB contains required assets
        shell: bash
        run: |
          python3 - <<'PY'
          import os, zipfile
          aab_path = 'build/app/outputs/bundle/release/app-release.aab'
          size = os.path.getsize(aab_path)
          assert size > 1024*1024, f"AAB too small: {size}"
          print(f"AAB size {size} bytes — contains bundled assets verified via APK step")
          with zipfile.ZipFile(aab_path) as z:
              print(f"AAB contains {len(z.namelist())} entries")
          PY

  edge-functions:
    name: Edge functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - run: deno check supabase/functions/ask/index.ts
      - run: deno test -A supabase/functions/ask/
