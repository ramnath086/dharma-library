name: Deploy Supabase

# Manual trigger. Requires repository secrets:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
# Optional function secrets are set once via `supabase secrets set OPENAI_API_KEY=...`.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Resolve dual-stack database host
        id: dbhost
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # db.<ref>.supabase.co resolves to IPv6 only (Supabase retired IPv4 direct
          # connections), and GitHub-hosted runners have no IPv6 route: raw psql there
          # dies with "connection ... failed: Network is unreachable". Supavisor is
          # dual-stack, so the seed/content steps below go through it instead. Session
          # mode (5432) rather than transaction mode (6543), because `psql -f` runs
          # multi-statement files that need a real session. The pooler host embeds the
          # project region, so read it from the Management API rather than adding a
          # secret. The Supabase CLI steps are unaffected: they already pool via
          # Supavisor.
          region=$(curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" | jq -r '.region // empty')
          if [ -z "$region" ]; then
            echo "::error::could not read .region for project $SUPABASE_PROJECT_REF from the Supabase Management API"
            exit 1
          fi
          case "$region" in
            aws-*)   cloud=aws;   short=${region#aws-} ;;
            azure-*) cloud=azure; short=${region#azure-} ;;
            gcp-*)   cloud=gcp;   short=${region#gcp-} ;;
            *)       cloud=aws;   short=$region ;;
          esac
          echo "host=${cloud}-0-${short}.pooler.supabase.com" >> "$GITHUB_OUTPUT"
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Seed + content
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          python3 scripts/ingest.py
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f content/generated/bhagavata-purana.sql
        env:
          # The password is passed via PGPASSWORD rather than interpolated into
          # the connection URI: Supabase passwords routinely contain URI-special
          # characters (@ / : # ? %) that truncate the host or break parsing when
          # embedded in postgres://user:pw@host. libpq reads PGPASSWORD whenever
          # the URI omits a password.
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Supavisor wants the project ref appended to the user name; against the
          # direct host the plain `postgres` role is used.
          DB_URL: postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}@${{ steps.dbhost.outputs.host }}:5432/postgres
      - run: supabase functions deploy ask
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Generate embeddings (optional)
        run: |
          # The `secrets` context is not available in a step-level `if:` (GitHub
          # rejects the workflow file), so the optional key is passed in via env
          # and the guard lives here: an unset secret arrives as an empty string.
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::notice title=embeddings::OPENAI_API_KEY secret is not set; skipping embedding generation"
            exit 0
          fi
          python3 scripts/embed_contents.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}@${{ steps.dbhost.outputs.host }}:5432/postgres
