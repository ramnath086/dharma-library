name: dharma_library
description: Multilingual Hindu scripture reader — Śrīmad Bhāgavata Purāṇa and beyond.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # backend
  supabase_flutter: ^2.8.0

  # state / routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # offline
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0

  # audio
  just_audio: ^0.9.42
  audio_session: ^0.1.21

  # ui
  google_fonts: ^6.2.1
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.4

  # misc
  collection: ^1.18.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/bundles/
